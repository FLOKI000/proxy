<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه من</title>

    <style>
        * {

        html, body {

            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: Tahoma, Arial, sans-serif;

        .website {
            position: fixed;
            inset: 0;

            height: 100%;

<body>

    <iframe
        class="website"
